# Audioserver, built from this repository.
#
# Coolify: create a resource from this Git repository and choose Docker Compose.
# This file is the one it should use. The image is built here; there is no
# registry image to pull. After the first start the admin and the player are at
# http://<host>:7090.
#
# Host networking is required. Loxone, Sonos, AirPlay and the speaker search
# all use multicast and fixed UDP ports, which a bridged Coolify network does
# not forward. The proxy in front of Coolify is not used for this service.
services:
  audioserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: audioserver:latest
    hostname: audioserver
    restart: unless-stopped
    network_mode: host
    # Starting time zone. A Miniserver sends its own during pairing, which then
    # applies, and the admin can set one under Settings.
    environment:
      TZ: ${TZ:-Europe/Berlin}
    # Mounting an SMB/NAS share from inside the container needs both of these, and neither works
    # without the other: SYS_ADMIN is what the mount itself requires, and Docker's default AppArmor
    # profile blocks mounting even when that capability is granted. Leaving security_opt out is the
    # usual cause of "mount error(13): Permission denied" on an otherwise correct share (#323).
    # Under rootless Docker or userns-remap, mounting from inside the container is not possible at
    # all — mount the share on the host there and pass the folder in as a volume instead.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    volumes:
      - audioserver-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7090/api/v1/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Power Manager note:
    # - gpioset needs the relevant /dev/gpiochip* device inside the container.
    # - USB HID relay boards via crelay need the matching /dev/hidraw* device.
    # - Example for Raspberry Pi 4 header GPIOs and one HID relay:
    # devices:
    #   - /dev/gpiochip0:/dev/gpiochip0
    #   - /dev/hidraw1:/dev/hidraw1

volumes:
  audioserver-data:
